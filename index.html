<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      body {
        background-color: #d5e1ef;
        height: 90dvh;
        margin: 0;
        padding: 0;
      }
      main {
        display: grid;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
      .card {
        background-color: #ffffff;
        border-radius: 4%;
        height: auto;
        max-width: 300px;

        padding: 20px;
        display: grid;
        text-align: center;
        gap: 1rem;
      }
      img {
        border-radius: 4%;
        max-width: 100%;
        height: auto;
      }
      .text {
        padding-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="flex">
        <div class="card">
          <img src="images/image-qr-code.png" alt="qr code" />
          <div class="text">
            <h3>Created By Jeremy Francis</h3>
            <p>
              Lorem ipsum dolor sit amet consectetur adipiscing elit. Dolor sit
              amet consectetur adipiscing elit quisque faucibus.
            </p>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by
        <a href="https://jeremydfrancis.dev/" target="_blank">Jeremy Francis</a
        >.
      </div>
    </footer>
  </body>
</html>
